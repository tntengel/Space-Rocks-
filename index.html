<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Rocks - Asteroid Defense Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0e27;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        #game {
            max-width: 100%;
        }
        h1 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <h1>🌍 SPACE ROCKS - Asteroid Defense 🚀</h1>
    <div id="game"></div>
    <script src="js/scenes/TelescapeScene.js"></script>
    <script src="js/scenes/DefenseScene.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
